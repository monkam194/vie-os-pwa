name: "\U0001F41E Bug report"
description: Signaler un bug
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description du bug
      description: Une description claire et concise du probleme.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Etapes pour reproduire
      placeholder: |
        1. Aller sur '...'
        2. Cliquer sur '...'
        3. Voir l'erreur
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Comportement attendu
    validations:
      required: false
  - type: input
    id: environment
    attributes:
      label: Environnement
      placeholder: "OS, version, navigateur..."
    validations:
      required: false
